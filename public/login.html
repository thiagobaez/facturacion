<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación · Ingresar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4ece6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body class="entrada">

<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="sheet chica">
	<span class="logo grande"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></svg></span>
	<h1>Facturación</h1>
	<p class="nota centrada">Ingresá con tu usuario.</p>

	<form id="login" novalidate>
		<label class="campo">
			<span>Usuario</span>
			<input type="text" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
		</label>
		<label class="campo">
			<span>Contraseña</span>
			<input type="password" name="clave" autocomplete="current-password" required>
		</label>
		<p class="error" id="error" role="alert" hidden></p>
		<button type="submit" class="btn" id="entrar">Ingresar</button>
	</form>
</main>

<footer class="legal">
	<p>© <span class="anio">2026</span> Thiago Fernando Baez. Todos los derechos reservados.</p>
	<p class="enlaces-legales"><a href="/terminos">Términos y condiciones</a><span aria-hidden="true">·</span><a href="/privacidad">Política de privacidad</a></p>
</footer>

<script src="login.js"></script>
<script src="legal.js"></script>
</body>
</html>
